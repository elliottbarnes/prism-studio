[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "prism-studio"
version = "1.0.0"
description = "A local diffusion workbench with repeatable runs and inspectable provenance."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "Elliott Barnes"}]
dependencies = ["pillow>=11,<13"]

[project.optional-dependencies]
inference = [
  "torch>=2.6,<3",
  "diffusers==0.40.0",
  "transformers>=4.49,<6",
  "accelerate>=1.3,<2",
  "safetensors>=0.5,<1",
  "invisible-watermark>=0.2,<1",
]
ui = ["streamlit==1.64.0"]

[project.scripts]
prism = "prism_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prism_studio"]

[tool.uv]
required-version = ">=0.8"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
